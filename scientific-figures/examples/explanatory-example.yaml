# An explanatory review figure: no claim of novelty, so no evidence channel to
# protect with the colour budget. Colour carries species identity instead, as
# it does in every published mechanism figure of this kind.
#
# Also exercises: qualifiers set beneath the name, prominence from the
# ontology family, label wrapping, and a pictogram bounded with its label.
#
# python render/figure_export.py examples/explanatory-example.yaml --resolve-assets

meta:
  title: "Platelet clearance in immune thrombocytopenia and where SyK sits"
  band: B
  figure_class: mechanism_of_action
  purpose: explanatory
  target: oa_cc_by
  claim: >
    Opsonised platelets are cleared by macrophage Fc receptor engagement
    through SyK; the same kinase carries B cell receptor signalling, which is
    why its inhibition acts at two points in the same disease.

compartments:
  - id: spleen
    label: "Splenic red pulp"
    type: physical

entities:
  - id: platelet
    label: "Platelet"
    qualifier: "GP IIb/IIIa bearing"
    class: cell
    synonyms: [blood cells]
    compartment: spleen

  - id: autoab
    label: "Autoantibody"
    qualifier: "anti-GP IIb/IIIa IgG"
    class: macromolecule
    compartment: spleen

  - id: macrophage
    label: "Macrophage"
    qualifier: "Fc receptor bearing"
    class: cell
    compartment: spleen
    prominence: primary

  - id: syk
    label: "SyK"
    qualifier: "spleen tyrosine kinase"
    class: macromolecule
    compartment: spleen
    identity: syk
    prominence: primary

  - id: phago
    label: "Platelet phagocytosis"
    class: process
    compartment: spleen

  - id: bcell
    label: "B cell"
    qualifier: "BCR signalling via SyK"
    class: cell
    identity: syk
    compartment: spleen


relations:
  - from: autoab
    to: platelet
    type: binding
    evidence: established
    source: "10.0000/example.opsonisation"

  - from: platelet
    to: syk
    type: stimulation
    evidence: established
    source: "10.0000/example.syk"

  - from: syk
    to: bcell
    type: stimulation
    evidence: established
    source: "10.0000/example.bcr"

  - from: syk
    to: phago
    type: catalysis
    evidence: established
    source: "10.0000/example.phagocytosis"

  - from: phago
    to: macrophage
    type: production
    evidence: established
    source: "10.0000/example.clearance"

  # Even in an explanatory figure the evidence channel is kept: a proposed
  # link is still dotted. That channel is never the one traded away.
  - from: bcell
    to: autoab
    type: production
    evidence: hypothesized
    source: "this work, proposed"
    label: "sustained autoantibody output"
